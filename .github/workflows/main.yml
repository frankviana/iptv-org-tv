name: Build Universal IPTV APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate AndroidManifest.xml
        run: |
          python3 - << 'PY'
          p = "android" + ":"
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:{p[:-1]}="http://android.com">
              <uses-permission {p}name="android.permission.INTERNET" />
              <uses-feature {p}name="android.software.leanback" {p}required="false" />
              <uses-feature {p}name="android.hardware.touchscreen" {p}required="false" />
              <application
                  {p}allowBackup="true"
                  {p}label="iptv-org TV"
                  {p}usesCleartextTraffic="true"
                  {p}theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      {p}name="com.knarf.iptvorgtv.MainActivity"
                      {p}exported="true"
                      {p}screenOrientation="landscape">
                      <intent-filter>
                          <action {p}name="android.intent.action.MAIN" />
                          <category {p}name="android.intent.category.LAUNCHER" />
                          <category {p}name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-org-TV-Android9+
          path: app/build/outputs/apk/release/*.apk
